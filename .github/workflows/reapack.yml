name: Build ReaPack Index

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The build job rebuilds index.xml from scratch and pushes it back to main. Two
# runs overlapping means the older one's push is rejected non-fast-forward and
# the run goes red for no real reason — and a red run that doesn't mean anything
# is worse than none, because it trains you to stop reading them. Superseding the
# in-flight run is correct here: --rebuild regenerates the whole index anyway, so
# only the newest run's output is ever wanted.
concurrency:
  group: reapack-index
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -yy lua5.4
          lua5.4 -v
      - name: Run test suite
        env:
          LUA: lua5.4
        run: ./run_tests.sh

  build:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Install Pandoc
        run: sudo apt-get install -yy pandoc

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2

      - name: Install reapack-index
        run: gem install reapack-index

      - name: Update index.xml
        run: reapack-index --rebuild --commit --verbose

      - name: Push changes
        run: git push
